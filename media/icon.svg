<!-- Activity bar mark. Five letters in a 24px square only fit stacked: OF over
     SQL. Stroked paths rather than <text>, so it renders the same wherever the
     icon is drawn and whatever fonts are installed. Monochrome by design — the
     activity bar tints it, so the logo's blue and orange cannot apply here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- O -->
  <ellipse cx="6.6" cy="6.6" rx="3.4" ry="4"/>
  <!-- F -->
  <path d="M14.6 10.6V2.6h6M14.6 6.6h4.8"/>
  <!-- S -->
  <path d="M6.6 14.6c-.5-.6-1.3-.9-2.1-.9-1.3 0-2.1.6-2.1 1.4 0 .9.8 1.2 2 1.4 1.3.1 2.2.5 2.2 1.5 0 .9-.8 1.6-2.1 1.6-.9 0-1.7-.3-2.1-.9"/>
  <!-- Q -->
  <ellipse cx="12.4" cy="17" rx="2.7" ry="3.3"/>
  <path d="M13.9 19.4l1.6 1.9"/>
  <!-- L -->
  <path d="M18.6 13.7v6.6h3.8"/>
</svg>
