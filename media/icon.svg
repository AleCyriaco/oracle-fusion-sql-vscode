<!-- Activity bar wordmark. Two rows rather than one: in a 24px square, FS over
     QL gives each letter roughly twice the height four in a line would allow.
     Stroked letterforms, not <text>, so they render identically wherever the
     icon is drawn and whatever fonts are installed — and the curved S reads as
     an S rather than as a 5, which a square stencil does not. Monochrome by
     design: the activity bar tints it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- F -->
  <path d="M3.4 11.4V3.1h6.2M3.4 7.1h5.1"/>
  <!-- S -->
  <path d="M20.7 4.3c-.6-.9-1.7-1.3-2.9-1.3-1.9 0-3.1.9-3.1 2.2 0 1.4 1.2 1.9 3 2.1 1.9.2 3.2.8 3.2 2.3 0 1.4-1.2 2.4-3.1 2.4-1.4 0-2.5-.4-3.1-1.3"/>
  <!-- Q -->
  <circle cx="6.4" cy="17.2" r="3.6"/>
  <path d="M8.6 19.6l2.1 2.3"/>
  <!-- L -->
  <path d="M15.2 13.2v7.8h6.1"/>
</svg>
