<!-- Activity bar mark: Oracle's wide O with FSQL set inside it.
     At 24px the inner letters stop being individually readable and the whole
     thing works as a silhouette instead — which is how a mark this small has
     to work. Stroked ring plus filled letterforms rather than <text>, so it
     renders identically wherever it is drawn. Monochrome: the activity bar
     tints it, so the logo's blue and orange cannot apply here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <ellipse cx="12" cy="12" rx="10.8" ry="8.7" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <g fill="currentColor">
    <!-- F -->
    <path d="M3.7 9.4h3.6v1.4H5.1v1h1.9v1.4H5.1v2.1H3.7z"/>
    <!-- S -->
    <path d="M7.9 9.4h3.6v1.4H9.3v.8h2.2v3.7H7.9v-1.4h2.2v-.9H7.9z"/>
    <!-- Q -->
    <path d="M14.1 9.4a2.5 2.5 0 012.2 3.7l.7.8-1.1.9-.7-.8a2.5 2.5 0 11-1.1-4.6zm0 1.4a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2z"/>
    <!-- L -->
    <path d="M17.6 9.4H19v4.4h2.2v1.5h-3.6z"/>
  </g>
</svg>
