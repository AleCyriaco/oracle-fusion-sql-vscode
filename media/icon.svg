<!-- Activity bar mark: the hexagon and isometric cube from the logo, reduced
     to outlines. The artwork's gradients and its two nested hexagons cannot
     survive here — the activity bar tints the icon a single colour and draws
     it at 24px — so one hexagon and the cube's three visible faces carry the
     shape. Geometry, not text, which is what still reads at this size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- Hexagon, vertices at top and bottom -->
  <path d="M12 1.9l8.7 5v10.2l-8.7 5-8.7-5V6.9z"/>
  <!-- Cube: top face, then the two vertical edges that give it depth -->
  <path d="M12 7l5.4 3.1-5.4 3.1-5.4-3.1z"/>
  <path d="M6.6 10.1v5.4L12 18.6l5.4-3.1v-5.4M12 13.2v5.4"/>
</svg>
